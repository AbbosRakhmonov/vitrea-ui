name: Publish to npm

# Publishes vitrea-ui to npm when a GitHub Release is published
# (or manually from the Actions tab). npm refuses to republish an existing
# version, so bump "version" in package.json before you tag / release
# (tag name: vitrea-vX.Y.Z).
#
# Authentication is npm Trusted Publishing (OIDC): no token is stored. The
# package requires 2FA and refuses tokens, so a token could not publish anyway.
#
# Requirements:
#   - On npmjs.com, vitrea-ui -> Settings -> Trusted Publisher: GitHub Actions,
#     repository AbbosRakhmonov/vitrea-ui, workflow publish.yml.
#   - npm 11.5.1 or newer (installed below) and id-token: write.
#   - A public repository whose URL matches package.json "repository.url";
#     provenance is then generated automatically.
on:
  release:
    types: [published]
  push:
    tags:
      # vitrea-ui releases are tagged vitrea-vX.Y.Z; the plain vX.Y.Z tags
      # belong to the previous @abbosraxmonov/liquid-ui package.
      - 'vitrea-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'

      # Trusted Publishing needs npm 11.5.1+; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
